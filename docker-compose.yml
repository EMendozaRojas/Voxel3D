services:
  # Base de datos. Los datos viven en el volumen `db-data`:
  # sobreviven a `docker compose down` y solo se borran con `down -v`.
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Solo accesible desde este ordenador (127.0.0.1), no desde la red
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bandeja de correo de prueba: atrapa todos los correos, nunca los entrega.
  # Web en http://localhost:8025. El puerto SMTP (1025) solo se usa dentro
  # de la red de Docker, por eso no se publica.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
