# Configuración de Alembic (migraciones de la base de datos).
# La dirección de la base NO va aquí: env.py la lee de `Settings` (DATABASE_URL),
# así nunca se guarda una contraseña en el repositorio.

[alembic]
script_location = %(here)s/alembic
# Nombres de archivo que se ordenan solos por fecha: 2026_10_29_1830-<id>_<mensaje>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
